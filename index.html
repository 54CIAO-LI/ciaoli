        }).join("")}
      </ol>
    </section>
    ${CATEGORIES.map((c) => {
      const works = WORKS.filter((w) => w.cat === c.id);
      const link = c.link ? `<p class="cat__link">${ext(c.link.url, `${c.link.label} · ${c.link.tc}`, "pill")}</p>` : "";
      return `
      <section class="cat cat--${c.id}" id="${c.id}" aria-labelledby="h-${c.id}" tabindex="-1">
        <div class="wrap">
          <header class="cat__head">
            <span class="cat__letter" aria-hidden="true">${c.letter}</span>
            <div class="cat__titles">
              <h2 id="h-${c.id}">${c.en}<span class="cat__tc" lang="zh-Hant">${c.tc}</span></h2>
            </div>
            <div class="cat__aside">
              ${link}
              ${c.notice ? `<p class="notice notice--cat" lang="zh-Hant"><span aria-hidden="true">※ </span>${NOTICE}</p>` : ""}
            </div>
          </header>
          <ul class="works works--${c.id}" role="list">
            ${works.map((w) => {
              const cap = (more) => `<span class="work__cap">
                    <span class="work__name">${esc(w.en)} <span lang="zh-Hant">${esc(w.tc)}</span></span>
                    <span class="work__meta">${more}</span>
                  </span>`;
              /* live: the card opens the published web page in a new tab */
              if (w.live) return `
              <li class="work work--${w.layout} reveal" id="c-${w.id}" data-face="${w.face || "modern"}">
                <a class="work__link" href="${w.live}" target="_blank" rel="noopener noreferrer" data-ext>
                  ${object(w)}
                  ${cap(`<span class="work__more work__more--show">Visit the live page · 前往網頁<span class="sr-only">（在新分頁開啟）</span> <span aria-hidden="true">↗</span></span>`)}
                </a>
                ${w.chapters ? `<ul class="chapters" aria-label="${esc(w.tc)} 各篇章">${w.chapters.map(([t, u]) => `<li><a class="pill pill--sm" href="${u}" target="_blank" rel="noopener noreferrer">${t}<span class="sr-only">（在新分頁開啟）</span> <span aria-hidden="true">↗</span></a></li>`).join("")}</ul>` : ""}
              </li>`;
              /* direct: the card itself opens the full image (no project page) */
              if (w.direct) return `
              <li class="work work--${w.layout} reveal" id="c-${w.id}" data-face="${w.face || "modern"}">
                <button class="work__link work__btn" type="button" data-key="${w.cover}" aria-label="放大檢視：${esc(w.en)} ${esc(w.tc)}">
                  ${object(w)}
                  ${cap(`<span class="work__more work__more--show"><span aria-hidden="true">⤢</span> View full image · 檢視完整圖表</span>`)}
                </button>
              </li>`;
              return `
              <li class="work work--${w.layout} reveal" id="c-${w.id}" data-face="${w.face || "modern"}">
                <a class="work__link" href="#work-${w.id}">
                  ${object(w, { eager: c.id === "social" })}
                  ${cap(`<span class="work__more">View project<span class="sr-only">：${esc(w.en)} ${esc(w.tc)}</span> <span aria-hidden="true">→</span></span>`)}
                </a>
              </li>`;
            }).join("")}
          </ul>
        </div>
      </section>`;
    }).join("")}`;
  document.title = "Selected Works";
  observeReveal();
}

/* ---------- project page ---------- */
const row = (keys, w) => `<div class="row">${keys.map((key) => `<figure${ratio(key) > 1.3 ? ' class="is-wide"' : ""} style="--f:${ratio(key)}">${pic(key, w, { zoom: true })}</figure>`).join("")}</div>`;
function block(b, w) {
  switch (b.t) {
    case "rows": return `<div class="b b-rows">${b.rows.map((r) => row(r, w)).join("")}</div>`;
    case "ui":
      return `<div class="b b-ui">${b.items.map((it) => `<figure class="ui ui--${it.s}${it.m ? ` ui--m-${it.m}` : ""}">${pic(it.k, w, { zoom: true })}<figcaption class="ui__name">${esc(it.name)}</figcaption></figure>`).join("")}</div>`;
    case "stack": {
      const cols = b.cols || 1, rowsN = Math.ceil(b.side.length / cols);
      const sideRatio = ratio(b.side[0]) * cols / rowsN;
      const main = `<figure class="stack__main" style="--f:${ratio(b.main)}">${pic(b.main, w, { zoom: true })}</figure>`;
      const side = `<div class="stack__side" style="--f:${sideRatio};--cols:${cols}">${b.side.map((key) => `<figure>${pic(key, w, { zoom: true })}</figure>`).join("")}</div>`;
      return `<div class="b b-stack">${b.left ? side + main : main + side}</div>`;
    }
    case "strip":
      return `<div class="b b-strip${b.tall ? " is-tall" : ""}"><p class="sr-only">系列作品，共 ${b.imgs.length} 張；在手機上可左右滑動。</p><div class="strip__track" tabindex="0" role="group" aria-label="系列作品">${b.imgs.map((key) => `<figure>${pic(key, w, { zoom: true })}</figure>`).join("")}</div></div>`;
    case "browser":
      return `<figure class="b b-browser${b.half ? " is-half" : ""}">
          <div class="browser">
            <div class="browser__bar"><span class="browser__dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="browser__url">${esc(b.url)}</span></div>
            ${pic(b.img, w, { zoom: true })}
          </div>
          <figcaption>${ext(b.link, "Visit the live page · 前往網頁", "pill")}<span class="ext__url">${esc(b.link.replace(/^https?:\/\//, ""))}</span></figcaption>
        </figure>`;
    case "letter":
      return `<div class="b b-letter"><p class="b-letter__label">${esc(b.label)}</p><div class="letter__grid">${b.imgs.map((key) => `<figure style="--r:${ratio(key)}">${pic(key, w, { zoom: true })}</figure>`).join("")}</div></div>`;
    case "tall": return `<figure class="b b-tall">${pic(b.img, w, { zoom: true })}</figure>`;
  }
  return "";
}

function renderWork(id) {
  const w = WORKS.find((x) => x.id === id);
  if (!w) return renderHome();
  const c = catOf(w), pages = WORKS.filter((x) => !(x.direct || x.live) || x === w), i = pages.indexOf(w);   // works that open directly have no page in the sequence
  const prev = pages[(i - 1 + pages.length) % pages.length], next = pages[(i + 1) % pages.length];
  const navItem = (x, dir) => `<a class="pn pn--${dir}" href="#work-${x.id}" style="--tone:${x.tone}"><span class="pn__thumb" aria-hidden="true">${imgTag(x.cover)}</span><span class="pn__text"><span class="pn__dir">${dir === "prev" ? "← Previous" : "Next →"}</span><span class="pn__name">${esc(x.en)} <span lang="zh-Hant">${esc(x.tc)}</span></span></span></a>`;
  $("#view").innerHTML = `
    <article class="project project--${c.id} wrap" aria-labelledby="p-title" data-face="${w.face || "modern"}">
      <nav class="crumbs" aria-label="麵包屑"><a class="pill" href="#${c.id}"><span aria-hidden="true">←</span> ${c.en}</a></nav>
      <header class="project__head" style="--tone:${w.tone}">
        <div class="project__titles">
          <p class="kicker">${c.en} <span lang="zh-Hant">${c.tc}</span></p>
          <h1 id="p-title" tabindex="-1">${esc(w.en)} <span class="project__tc" lang="zh-Hant">${esc(w.tc)}</span></h1>
          ${w.notice ? `<p class="notice" lang="zh-Hant"><span aria-hidden="true">※ </span>${NOTICE}</p>` : ""}
          <p class="hint">Tap any image to enlarge · 點選圖片可放大</p>
        </div>
        ${keysOf(w).includes(w.cover) || w.homeOnly ? "" : `<figure class="project__cover">${object(w, { eager: true })}</figure>`}
      </header>
      <div class="project__body">${w.blocks.map((b) => block(b, w)).join("")}</div>
      <nav class="pager" aria-label="其他作品">${navItem(prev, "prev")}${navItem(next, "next")}</nav>
    </article>`;
  document.title = `${w.en} ${w.tc} — Selected Works`;
}

/* ---------- lightbox (native <dialog>: focus stays inside, Esc closes) ---------- */
const lb = { keys: [], i: 0, opener: null };
function openLightbox(btn) {
  const scope = btn.closest(".project__body, .works") || document;              // browse within this project, or within this home-page group
  lb.keys = [...scope.querySelectorAll(".zoom, .work__btn")].map((b) => b.dataset.key);
  lb.i = lb.keys.indexOf(btn.dataset.key);
  lb.opener = btn;
  showLb();
  $("#lightbox").showModal();
}
function showLb() {
  const key = lb.keys[lb.i], w = WORKS.find((x) => current === `work-${x.id}`);
  const im = $("#lb-img");
  im.classList.remove("is-shown");
  im.src = src(key); im.width = DIMS[key][0]; im.height = DIMS[key][1];
  const stage = $(".lb__stage");
  stage.classList.toggle("is-tall", DIMS[key][0] / DIMS[key][1] < 0.6);   // long infographics: full width, scroll to read
  stage.scrollTop = 0;
  if (stage.classList.contains("is-tall")) { stage.tabIndex = 0; stage.setAttribute("aria-label", "長圖，可上下捲動閱讀"); stage.setAttribute("role", "region"); }
  else { stage.removeAttribute("tabindex"); stage.removeAttribute("aria-label"); stage.removeAttribute("role"); }
  im.alt = altOf(key, w || { tc: "" });
  $("#lb-count").textContent = `${lb.i + 1} / ${lb.keys.length}`;
  $("#lb-caption").textContent = im.alt;
  im.decode?.().catch(() => {}).finally(() => im.classList.add("is-shown"));
}
const stepLb = (d) => { lb.i = (lb.i + d + lb.keys.length) % lb.keys.length; showLb(); };

/* ---------- gentle reveal: content is always visible; only a small lift is animated ---------- */
function observeReveal() {
  if (!("IntersectionObserver" in window) || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("is-in"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -8% 0px" });
  document.querySelectorAll(".reveal").forEach((el) => {
    if (el.getBoundingClientRect().top > innerHeight) { el.classList.add("is-pending"); io.observe(el); }
  });
}

/* ---------- routing: #work-<id> opens a project, other #names scroll ---------- */
/* The current view lives in `current`, so the site works even where the page
   address cannot change (embedded previews, CodePen, pages with a <base> tag).
   The address bar is updated too when the browser allows it. */
let current = decodeURIComponent(location.hash.slice(1));
let lastWork = null;                                    // the project you just left — used to land back on its cover
const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
/* swap views with a soft cross-fade where the browser supports View Transitions */
function swap(fn) {
  if (document.startViewTransition && !calm()) document.startViewTransition(fn);
  else fn();
}
function go(h) {
  const changesView = h.startsWith("work-") || current.startsWith("work-");
  current = h;
  try { history.pushState({ h }, "", location.href.split("#")[0] + "#" + h); } catch (err) { /* address can't change here — fine */ }
  changesView ? swap(route) : route();
}
/* jump to the top without animation — works in every browser (some Safari versions reject behavior: "instant") */
function jumpTop() {
  const root = document.documentElement, prev = root.style.scrollBehavior;
  root.style.scrollBehavior = "auto"; window.scrollTo(0, 0); root.style.scrollBehavior = prev;
}
function route() {
  const h = current;
  if (h === "view") { $("#view").focus(); return; }                         // skip link
  const live = $("#live");
  if (h.startsWith("work-")) {
    lastWork = h.slice(5);
    renderWork(h.slice(5));
    jumpTop();
    $("#p-title")?.focus({ preventScroll: true });
    live.textContent = `已開啟作品頁：${document.title}`;
  } else {
    if (!$(".intro")) renderHome();
    document.title = "Selected Works";
    if (h === "top" || !h) jumpTop();
    let target = h && h !== "top" ? document.getElementById(h) : null;
    // coming back from a project: land on that project's cover instead of the section top
    const back = lastWork && WORKS.find((w) => w.id === lastWork);
    if (back && (!h || h === back.cat)) {
      const card = document.getElementById(`c-${back.id}`);
      if (card) { jumpTop(); card.scrollIntoView({ block: "center" }); card.querySelector(".work__link")?.focus({ preventScroll: true }); card.classList.add("is-back"); setTimeout(() => card.classList.remove("is-back"), 1600); target = null; }
    }
    lastWork = null;
    if (target) { target.scrollIntoView({ behavior: calm() ? "auto" : "smooth" }); target.focus({ preventScroll: true }); }
  }
  document.querySelectorAll(".nav a").forEach((a) => {
    const on = a.getAttribute("href") === `#${h}` || (a.getAttribute("href") === "#top" && (!h || h === "top")) || (h.startsWith("work-") && WORKS.find((w) => `work-${w.id}` === h)?.cat === a.getAttribute("href").slice(1));
    on ? a.setAttribute("aria-current", "true") : a.removeAttribute("aria-current");
  });
}

/* ---------- light / dark theme ----------
   The choice is stored in this browser; without a stored choice the system setting is used.
   (An inline script in <head> applies it before the page paints, so there is no flash.) */
const themeBtn = $("#theme-btn");
const getMode = () => document.documentElement.dataset.mode === "dark" ? "dark" : "light";
function syncThemeBtn() {
  const dark = getMode() === "dark";
  themeBtn.setAttribute("aria-pressed", String(dark));
  themeBtn.setAttribute("aria-label", dark ? "切換為淺色模式 Light mode" : "切換為深色模式 Dark mode");
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content", dark ? "#16162A" : "#CDCDE6");
}
function setMode(mode) {
  const apply = () => { document.documentElement.dataset.mode = mode; syncThemeBtn(); };
  try { localStorage.setItem("sw-theme", mode); } catch (err) { /* storage blocked — the choice lasts for this visit */ }
  if (calm()) return apply();
  if (document.startViewTransition) return document.startViewTransition(apply);
  const root = document.documentElement;                          // fallback: soft colour transition
  root.classList.add("theme-shift"); apply();
  setTimeout(() => root.classList.remove("theme-shift"), 500);
}
themeBtn.addEventListener("click", () => setMode(getMode() === "dark" ? "light" : "dark"));
syncThemeBtn();

/* ---------- design edition: Y2K (default) or Blackletter Typography ----------
   Both editions share the same content and code; the Blackletter styles live in their own
   CSS section, scoped to :root[data-edition="blackletter"], so neither overrides the other. */
const editionBtn = $("#edition-btn");
const getEdition = () => document.documentElement.dataset.edition === "blackletter" ? "blackletter" : "y2k";
function syncEditionBtn() {
  const bl = getEdition() === "blackletter";
  editionBtn.setAttribute("aria-pressed", String(bl));
  editionBtn.setAttribute("aria-label", bl ? "切換為 Y2K 版本 Y2K edition" : "切換為歌德字體版本 Blackletter edition");
  editionBtn.title = bl ? "Y2K edition" : "Blackletter edition";
}
function setEdition(ed) {
  const apply = () => { document.documentElement.dataset.edition = ed; syncEditionBtn(); };
  try { localStorage.setItem("sw-edition", ed); } catch (err) { /* storage blocked — lasts for this visit */ }
  if (!calm() && document.startViewTransition) document.startViewTransition(apply); else apply();
}
editionBtn.addEventListener("click", () => setEdition(getEdition() === "blackletter" ? "y2k" : "blackletter"));
syncEditionBtn();

/* ---------- back to top: shows after scrolling past roughly one screen ---------- */
const toTop = $("#to-top");
const onScroll = () => toTop.classList.toggle("is-on", scrollY > innerHeight * 0.9);
addEventListener("scroll", onScroll, { passive: true });
document.addEventListener("click", (e) => {
  if (!e.target.closest("#to-top, .js-top")) return;
  e.preventDefault();
  scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  ($("#p-title") || $("#intro-title") || $("#view")).focus({ preventScroll: true });   // keyboard users land at the top too
});

/* ---------- responsive navigation menu (phone + tablet) ---------- */
const head = $("#site-head"), menuBtn = $("#menu-btn"), menu = $("#site-menu"), scrim = $("#scrim");
const desktop = matchMedia("(min-width: 1024px)");
const isOpen = () => menuBtn.getAttribute("aria-expanded") === "true";
function setMenu(open, { returnFocus = true } = {}) {
  if (desktop.matches) open = false;
  menuBtn.setAttribute("aria-expanded", String(open));
  menuBtn.setAttribute("aria-label", open ? "Close menu 關閉選單" : "Menu 選單");
  head.classList.toggle("is-open", open);
  document.documentElement.classList.toggle("is-locked", open);           // page underneath does not scroll
  // everything outside the header is inert while the menu is open: no clicks, no Tab, hidden from screen readers
  ["#view", ".site-foot", "#to-top", ".skip", "#theme-btn", "#edition-btn"].forEach((s) => { const el = $(s); if (el) el.inert = open; });
  if (open) {
    scrim.hidden = false; requestAnimationFrame(() => scrim.classList.add("is-on"));
    menu.querySelector("a").focus({ preventScroll: true });
  } else {
    scrim.classList.remove("is-on");
    setTimeout(() => { if (!isOpen()) scrim.hidden = true; }, 300);
    if (returnFocus) menuBtn.focus({ preventScroll: true });
  }
}
menuBtn.addEventListener("click", () => setMenu(!isOpen()));
scrim.addEventListener("click", () => setMenu(false));                       // click outside closes
menu.addEventListener("click", (e) => {
  const a = e.target.closest("a"); if (!a) return;
  if (isOpen()) setMenu(false, { returnFocus: false });
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && isOpen()) { e.preventDefault(); setMenu(false); }  // Esc closes
  if (e.key === "Tab" && isOpen()) {                                         // keep Tab inside the button + menu
    const items = [menuBtn, ...menu.querySelectorAll("a")];
    const first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
desktop.addEventListener("change", () => { if (isOpen()) setMenu(false, { returnFocus: false }); });

/* ---------- events ---------- */
/* every in-page link (#social, #work-pet-app, #top …) is handled here, without leaving the page */
document.addEventListener("click", (e) => {
  const a = e.target.closest('a[href^="#"]');
  if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  e.preventDefault();
  go(decodeURIComponent(a.getAttribute("href").slice(1)));
});
document.addEventListener("click", (e) => {
  const z = e.target.closest(".zoom, .work__btn");
  if (z) return openLightbox(z);
  if (e.target.closest("#lb-prev")) stepLb(-1);
  if (e.target.closest("#lb-next")) stepLb(1);
  if (e.target.closest("#lb-close") || e.target.id === "lightbox") $("#lightbox").close();
});
$("#lightbox").addEventListener("keydown", (e) => { if (e.key === "ArrowRight") stepLb(1); if (e.key === "ArrowLeft") stepLb(-1); });
$("#lightbox").addEventListener("close", () => lb.opener?.focus());
let x0 = null;
$("#lightbox").addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; }, { passive: true });
$("#lightbox").addEventListener("touchend", (e) => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 50) stepLb(dx < 0 ? 1 : -1); }, { passive: true });

document.documentElement.lang = "zh-Hant";
renderHome();
route();
onScroll();
addEventListener("hashchange", () => { current = decodeURIComponent(location.hash.slice(1)); route(); });
addEventListener("popstate", (e) => { current = (e.state && e.state.h) || decodeURIComponent(location.hash.slice(1)); swap(route); });
</script>
</body>
</html>
