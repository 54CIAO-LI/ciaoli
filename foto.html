<style>
/* ==========================================================================
   FOTO! — CIAO-LI Photography

   Art direction
   · Photography is the subject: true ratios, original colour, generous space.
   · Early-2000s digital culture is the atmosphere: film strips, a disc-player
     transport, a tape list, an e-mail window — one idea per page, not all of
     them everywhere.
   · The GBA is the brand: PRESS START, the handheld with A/B, pixel icons,
     pixel buttons, the pixel page-change. It lives in navigation and
     interaction, not on top of the pictures.

   Design system
   1  Colour      cream wall · black ink · brand gold · GBA shell grey
   2  Type        Space Grotesk (English titles & UI text) · Noto Sans TC (中文)
                  DM Mono (numbers, frames, timecode, labels)
                  Press Start 2P (GBA only: HELLO!, PRESS START, buttons, menus)
   3  Grid        12 columns · max 1360 · fluid side margin · fluid gutter
   4  Spacing     8 · 16 · 24 · 40 · 64 · 104 · 160 (the last three fluid)
   5  Buttons     .btn (pixel, gold) · .btn--dark · .btn--light · .link · .key
   6  Navigation  pixel icon bar · D-pad start menu · yellow footer
   7  Motion      UI: short, stepped (GBA) · photos: slow fades · reduced-motion aware
   ========================================================================== */

/* ---------- 1. Fonts (self-hosted, OFL; Noto Sans TC subset to this site's characters) ---------- */
@font-face { font-family: 'Press Start 2P'; font-weight: 400; font-display: swap; src: url('fonts/press-start-2p-latin.woff2') format('woff2'); }
@font-face { font-family: 'Space Grotesk'; font-weight: 300 700; font-display: swap; src: url('fonts/space-grotesk-latin-wght.woff2') format('woff2'); }
@font-face { font-family: 'DM Mono'; font-weight: 400; font-display: swap; src: url('fonts/dm-mono-latin-400.woff2') format('woff2'); }
@font-face { font-family: 'DM Mono'; font-weight: 500; font-display: swap; src: url('fonts/dm-mono-latin-500.woff2') format('woff2'); }
@font-face { font-family: 'Noto Sans TC'; font-weight: 400; font-display: swap; src: url('fonts/noto-sans-tc-site-400.woff2') format('woff2'); }
@font-face { font-family: 'Noto Sans TC'; font-weight: 700; font-display: swap; src: url('fonts/noto-sans-tc-site-700.woff2') format('woff2'); }

/* ---------- 2. Tokens ---------- */
:root {
    color-scheme: light;
    /* colour */
    --wall: #fbf8ee;
    --wall-2: #f2ecd9;
    --ink: #000;
    --ink-soft: #3c392f;
    --mute: #6f6a5d;
    --rule: rgba(0, 0, 0, .13);
    --rule-strong: rgba(0, 0, 0, .35);
    --gold: #E1C564;
    --gold-2: #caa728;
    --gold-3: #a8871c;
    --shell: #2b2b2b;
    --room: #000;
    --room-text: #ece7d8;
    --room-mute: #9b958a;
    --black: #000;
    --panel: #fff;
    --head-bg: rgba(251, 248, 238, .94);

    /* type */
    --f-pixel: 'Press Start 2P', 'Courier New', monospace;
    --f-sans: 'Space Grotesk', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
    --f-mono: 'DM Mono', ui-monospace, 'Noto Sans TC', 'PingFang TC', monospace;
    --pixel: var(--f-pixel);
    --text: var(--f-sans);
    --fs-page: clamp(48px, 7.4vw, 120px);
    --fs-section: clamp(32px, 4.2vw, 64px);
    --fs-title: clamp(20px, 1.8vw, 26px);
    --fs-body: 17px;
    --fs-small: 15px;
    --fs-label: 12px;

    /* grid & space */
    --max: 1360px;
    --pad: clamp(20px, 5vw, 72px);
    --gutter: clamp(16px, 2vw, 28px);
    --s1: 8px; --s2: 16px; --s3: 24px; --s4: 40px;
    --s5: clamp(48px, 5vw, 64px);
    --s6: clamp(72px, 8vw, 104px);
    --s7: clamp(96px, 12vw, 160px);
    --head: 80px;

    /* motion */
    --ease: cubic-bezier(.2, .7, .1, 1);
    --t-fast: .15s;
    --t-base: .3s;
    --t-slow: .9s;
}
[data-theme="dark"] {
    color-scheme: dark;
    --wall: #16150f;
    --wall-2: #222018;
    --panel: #1e1c15;
    --ink: #f2edde;
    --ink-soft: #d2cbb6;
    --mute: #a19a86;
    --rule: rgba(242, 237, 222, .14);
    --rule-strong: rgba(242, 237, 222, .4);
    --gold-3: #d6b54c;
    --head-bg: rgba(22, 21, 15, .92);
}
.theme-anim, .theme-anim *:not(img):not(video) { transition: background-color .45s ease, color .45s ease, border-color .45s ease, fill .45s ease, box-shadow .45s ease !important; }

/* ---------- 3. Base ---------- */
*, *::before, *::after { box-sizing: border-box; min-width: 0; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--head) + 24px); }
body { margin: 0; background: var(--wall); color: var(--ink); font: 400 var(--fs-body)/1.7 var(--f-sans); font-feature-settings: "ss01"; overflow-x: hidden; overflow-x: clip; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
img, video { display: block; max-width: 100%; height: auto; }
button, input, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; font-weight: 400; }
ul, ol { margin: 0; padding: 0; list-style: none; }
.frame { width: min(var(--max), 100% - var(--pad) * 2); margin-inline: auto; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: fixed; left: 16px; top: -60px; z-index: 999; padding: 12px 16px; background: var(--black); color: var(--gold); font: 500 13px/1.4 var(--f-mono); text-decoration: none; }
.skip:focus { top: 16px; }
:focus-visible { outline: 2px solid var(--gold-3); outline-offset: 4px; }
.ph { opacity: 0; transition: opacity 1s var(--ease); }
.ph.is-loaded { opacity: 1; }
.js .reveal { opacity: 0; transform: translateY(14px); transition: opacity var(--t-slow) var(--ease), transform var(--t-slow) var(--ease); }
.js .reveal.is-in { opacity: 1; transform: none; }
.block { padding-block: var(--s7); }
.block-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 16px 40px; margin-bottom: var(--s5); }

/* ---------- 4. Typography ---------- */
/* GBA display: only HELLO! and GAME OVER */
.t-giant { font: clamp(40px, 7vw, 112px)/1 var(--f-pixel); letter-spacing: .02em; text-shadow: .06em .06em 0 var(--gold); }
.t-page { font: 600 var(--fs-page)/.92 var(--f-sans); letter-spacing: -.045em; }
.t-section { font: 600 var(--fs-section)/1 var(--f-sans); letter-spacing: -.035em; }
.t-title { font: 500 var(--fs-title)/1.25 var(--f-sans); letter-spacing: -.015em; }
.t-body { font-size: var(--fs-body); line-height: 1.75; color: var(--ink-soft); max-width: 36em; }
.t-zh { font: 400 var(--fs-small)/1.6 var(--f-sans); letter-spacing: .04em; color: var(--mute); }
.t-label { font: 400 var(--fs-label)/1.4 var(--f-mono); letter-spacing: .04em; color: var(--mute); font-variant-numeric: tabular-nums; }
.room .t-label, .room .t-zh { color: var(--room-mute); }

/* text link: DM Mono with a gold rule; the arrow moves on hover */
.link { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0; border: 0; background: none; font: 500 13px/1 var(--f-mono); letter-spacing: .06em; color: inherit; text-decoration: none; cursor: pointer; }
.link::after { content: "→"; transition: transform var(--t-base) var(--ease); }
.link { background-image: linear-gradient(var(--gold), var(--gold)); background-size: 100% 2px; background-position: 0 calc(50% + 12px); background-repeat: no-repeat; }
.link:hover::after, .link:focus-visible::after, a:hover > .link::after, a:focus-visible > .link::after { transform: translateX(6px); }

/* ---------- 5. Buttons ---------- */
/* pixel buttons are the GBA part of the UI: notched outline + hard drop */
.px { --line: var(--ink); --drop: transparent; position: relative; margin: 4px; box-shadow: 0 -4px 0 0 var(--line), 0 4px 0 0 var(--line), -4px 0 0 0 var(--line), 4px 0 0 0 var(--line), 8px 8px 0 0 var(--drop); }
.px--drop { --drop: var(--gold); }
.win { background: var(--wall); }
.btn { --bg: var(--gold); --fg: var(--black); display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 22px; border: 0; background: var(--bg); color: var(--fg); font: 11px/1.4 var(--f-pixel); letter-spacing: .04em; text-decoration: none; cursor: pointer; transition: transform .12s steps(2); user-select: none; -webkit-tap-highlight-color: transparent; }
.btn.px { --drop: var(--ink); }
.btn:hover { transform: translate(-2px, -2px); }
.btn:active { transform: translate(4px, 4px); --drop: transparent; }
.btn svg { width: 16px; height: 16px; fill: currentColor; shape-rendering: crispEdges; }
.btn--dark { --bg: var(--black); --fg: var(--gold); }
.btn--dark.px { --line: var(--black); --drop: var(--gold); }
.btn--light { --bg: var(--wall); --fg: var(--ink); }
[data-theme="dark"] .btn.px { --drop: var(--gold-3); }
/* transport / arrow keys */
.key { display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 1px solid var(--rule-strong); border-radius: 50%; background: none; color: inherit; cursor: pointer; transition: background-color var(--t-fast), border-color var(--t-fast), color var(--t-fast); }
.key svg { width: 14px; height: 14px; fill: currentColor; shape-rendering: crispEdges; }
.key:hover, .key[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--black); }
.key:active { transform: translateY(1px); }
.close { display: grid; place-items: center; width: 44px; height: 44px; border: 0; background: none; font: 400 20px/1 var(--f-sans); cursor: pointer; }
.close:hover { color: var(--gold-3); }
.px-icon { width: 1em; height: 1em; display: inline-block; flex: none; vertical-align: -.15em; fill: currentColor; shape-rendering: crispEdges; }
/* GBA ▶ cursor, used only inside game menus */
.cur { position: relative; }
@keyframes blink { 50% { opacity: 0; } }

/* ---------- 6. Header, pixel navigation, start menu ---------- */
.head { position: sticky; top: 0; z-index: 50; background: var(--head-bg); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid transparent; transition: border-color var(--t-base); }
.head.is-scrolled { border-bottom-color: var(--rule); }
.head__in { height: var(--head); display: flex; align-items: center; gap: 24px; }
.head__logo { flex: none; line-height: 0; }
.head__logo img { width: 92px; }
[data-theme="dark"] .head__logo { padding: 2px 8px; background: var(--gold); border-radius: 6px 6px 14px 6px; }
[data-theme="dark"] .head__logo img { width: 80px; }
.nav { margin-left: auto; }
.nav__list { display: flex; gap: clamp(2px, .6vw, 10px); }
.head__tools { display: flex; align-items: center; gap: clamp(2px, .6vw, 10px); padding-left: clamp(8px, 1.4vw, 20px); margin-left: clamp(4px, 1vw, 12px); border-left: 1px solid var(--rule); }
.ico { position: relative; display: grid; place-items: center; width: 48px; height: 48px; padding: 0; border: 0; background: none; color: var(--ink-soft); text-decoration: none; cursor: pointer; transition: color var(--t-fast), background-color var(--t-fast); }
.ico svg { width: 22px; height: 22px; fill: currentColor; shape-rendering: crispEdges; transition: transform .2s steps(2); }
.ico:hover, .ico:focus-visible { color: var(--ink); }
.ico:hover svg, .ico:focus-visible svg { transform: translateY(-2px); }
.ico[aria-current="page"], .ico[aria-expanded="true"] { background: var(--gold); color: var(--black); }
.ico::after { content: attr(data-tip); position: absolute; top: calc(100% + 10px); left: 50%; z-index: 2; padding: 7px 9px 6px; background: var(--black); color: var(--gold); font: 9px/1 var(--f-pixel); letter-spacing: .04em; white-space: nowrap; transform: translate(-50%, -4px); opacity: 0; visibility: hidden; pointer-events: none; transition: opacity var(--t-fast) steps(2), transform var(--t-fast) steps(2), visibility var(--t-fast); }
.ico:hover::after, .ico:focus-visible::after { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
.ico--menu[aria-expanded="true"]::after { opacity: 0; visibility: hidden; }
.ico__badge { position: absolute; top: 5px; right: 3px; min-width: 17px; height: 16px; padding: 0 4px; display: grid; place-items: center; border-radius: 8px; background: var(--black); color: var(--gold); font: 500 10px/1 var(--f-mono); }
.ico.bump svg { animation: bump .4s steps(3); }
@keyframes bump { 50% { transform: translateY(-6px); } }
.ico--menu { display: none; }

.menu { position: fixed; z-index: 60; top: calc(var(--head) + 8px); right: var(--pad); width: min(320px, calc(100% - var(--pad) * 2)); max-height: calc(100dvh - var(--head) - 24px); overflow-y: auto; padding: 12px; visibility: hidden; clip-path: inset(0 0 100% 0); transition: clip-path .28s steps(6), visibility 0s .28s; }
.menu.on { visibility: visible; clip-path: inset(-12px); transition: clip-path .28s steps(6), visibility 0s; }
.menu ul { display: grid; gap: 2px; }
.menu__item { position: relative; display: flex; align-items: center; gap: 16px; width: 100%; min-height: 52px; padding: 0 14px 0 34px; border: 0; background: none; font: 12px/1.2 var(--f-pixel); letter-spacing: .03em; text-align: left; text-decoration: none; color: var(--ink); cursor: pointer; }
.menu__item svg { width: 22px; height: 22px; flex: none; fill: currentColor; shape-rendering: crispEdges; }
.menu__item::before { content: "▶"; position: absolute; left: 12px; font: 9px/1 var(--f-pixel); color: var(--gold-3); opacity: 0; }
.menu__item:hover, .menu__item:focus-visible { background: rgba(225, 197, 100, .28); outline: none; }
.menu__item:hover::before, .menu__item:focus-visible::before, .menu__item[aria-current="page"]::before { opacity: 1; animation: blink 1s steps(1) infinite; }
.menu__item[aria-current="page"] { background: var(--gold); color: var(--black); }
.menu hr { height: 1px; margin: 8px 0; border: 0; background: var(--rule); }

.totop { position: fixed; z-index: 40; right: max(var(--pad), env(safe-area-inset-right)); bottom: calc(max(24px, env(safe-area-inset-bottom)) + var(--lift, 0px)); display: grid; place-items: center; width: 52px; height: 52px; padding: 0; border: 3px solid var(--black); border-radius: 12px; background: var(--shell); color: var(--gold); box-shadow: 0 5px 0 var(--black); cursor: pointer; opacity: 0; visibility: hidden; transform: translateY(12px); transition: opacity var(--t-base) steps(3), transform var(--t-base) steps(3), visibility 0s var(--t-base), background-color var(--t-fast), color var(--t-fast); -webkit-tap-highlight-color: transparent; }
.totop.on { opacity: 1; visibility: visible; transform: none; transition: opacity var(--t-base) steps(3), transform var(--t-base) steps(3), visibility 0s, background-color var(--t-fast), color var(--t-fast); }
.totop svg { width: 22px; height: 22px; fill: currentColor; shape-rendering: crispEdges; }
.totop:hover, .totop:focus-visible { background: var(--gold); color: var(--black); }
.totop:active { transform: translateY(5px); box-shadow: 0 0 0 var(--black); }

/* page change: pixel blinds (GBA), quick */
#app { min-height: 70vh; outline: none; }
.view { animation: viewIn .45s var(--ease) both; }
@keyframes viewIn { from { opacity: 0; } }
.wipe { position: fixed; inset: 0; z-index: 80; display: flex; pointer-events: none; }
.wipe i { flex: 1; background: var(--gold); transform: scaleY(0); }
.wipe i:nth-child(even) { background: var(--black); }
.wipe.run i { animation: blind .5s steps(5) both; }
.wipe.run i:nth-child(2) { animation-delay: .02s; } .wipe.run i:nth-child(3) { animation-delay: .04s; }
.wipe.run i:nth-child(4) { animation-delay: .06s; } .wipe.run i:nth-child(5) { animation-delay: .08s; }
.wipe.run i:nth-child(6) { animation-delay: .1s; } .wipe.run i:nth-child(7) { animation-delay: .12s; }
.wipe.run i:nth-child(8) { animation-delay: .14s; }
@keyframes blind { 0% { transform: scaleY(0); transform-origin: top; } 45%, 55% { transform: scaleY(1); transform-origin: top; } 56% { transform-origin: bottom; } 100% { transform: scaleY(0); transform-origin: bottom; } }

/* ---------- 7. Shared page heads ---------- */
.page-head { display: grid; gap: var(--s3); padding-block: var(--s6) var(--s5); }
.page-head__row, .page-head--split { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 16px 48px; }
.crumbs { display: flex; gap: 10px; font: 400 var(--fs-label)/1.4 var(--f-mono); letter-spacing: .04em; color: var(--mute); }
.crumbs a { color: inherit; text-decoration: none; }
.crumbs a:hover { color: var(--ink); }
.crumbs [aria-current] { color: var(--ink); }

/* ==========================================================================
   HOME — brand experience: split hero (type + handheld), then three movements
   ========================================================================== */
.hero { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gutter); align-items: center; min-height: min(calc(100svh - var(--head)), 860px); padding-block: var(--s5) var(--s6); }
.hero__copy { grid-column: 1 / span 5; display: grid; gap: var(--s4); align-content: center; }
.hero__kicker { color: var(--ink-soft); }
.hero__hello { animation: hello 1.6s steps(8) both; }
@keyframes hello { 0% { color: var(--wall); letter-spacing: .3em; } 100% { color: var(--ink); } }
.index ol { border-top: 1px solid var(--rule); }
.index__link { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: baseline; gap: 12px; padding: 16px 0 14px; border-bottom: 1px solid var(--rule); color: var(--ink); text-decoration: none; }
.index__name { font: 600 clamp(26px, 2.6vw, 38px)/1 var(--f-sans); letter-spacing: -.03em; transition: transform var(--t-base) var(--ease); }
.index__arrow { font: 400 22px/1 var(--f-sans); opacity: 0; transform: translateX(-10px); transition: opacity var(--t-base), transform var(--t-base) var(--ease); }
.index__link:hover .index__name, .index__link:focus-visible .index__name { transform: translateX(8px); }
.index__link:hover .index__arrow, .index__link:focus-visible .index__arrow { opacity: 1; transform: none; }
.index__link:hover .index__no { color: var(--gold-3); }
.hero__device { grid-column: 7 / -1; }

/* the handheld (brand object) */
.gba { position: relative; width: 100%; display: grid; grid-template-columns: minmax(84px, 1fr) minmax(0, 3.2fr) minmax(84px, 1fr); align-items: center; gap: clamp(12px, 2vw, 28px); padding: clamp(16px, 2.2vw, 30px) clamp(16px, 2.4vw, 34px); background: var(--gold); border: 4px solid var(--black); border-radius: 44px 44px 110px 110px / 44px 44px 66px 66px; box-shadow: inset 0 -10px 0 rgba(0, 0, 0, .12), 10px 10px 0 var(--black); }
.gba::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: radial-gradient(120% 70% at 12% 0%, rgba(255, 255, 255, .3), rgba(255, 255, 255, 0) 46%); }
.gba > :not(.gba__shoulder) { position: relative; z-index: 1; }
.gba__shoulder { position: absolute; top: -12px; width: 22%; height: 16px; background: var(--shell); border: 4px solid var(--black); border-bottom: 0; }
.gba__shoulder.l { left: 9%; border-radius: 22px 8px 0 0; }
.gba__shoulder.r { right: 9%; border-radius: 8px 22px 0 0; }
.gba__bezel { padding: clamp(10px, 1.4vw, 16px) clamp(12px, 1.8vw, 22px) clamp(10px, 1.2vw, 14px); background: var(--shell); border: 4px solid var(--black); border-radius: 14px 14px 30px 30px; }
.gba__status { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; color: #b6ae99; font: 8px/1 var(--f-pixel); }
.gba__led { display: inline-flex; align-items: center; gap: 8px; }
.gba__led::before { content: ""; width: 8px; height: 8px; background: #e04b3c; box-shadow: 0 0 6px #e04b3c; }
.screen { position: relative; display: block; aspect-ratio: 3 / 2; overflow: hidden; background: #111; border: 2px solid var(--black); }
.screen > img, .screen > video { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-fit: cover; transition: opacity .5s steps(4); }
.screen > .off { opacity: 0; }
.screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(transparent 0 2px, rgba(0, 0, 0, .07) 2px 3px); }
.screen__label { position: absolute; z-index: 1; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; background: linear-gradient(transparent, rgba(0, 0, 0, .7)); color: var(--wall); font: 9px/1.5 var(--f-pixel); }
.gba__brand { margin-top: 10px; text-align: center; color: #b6ae99; font: 8px/1 var(--f-pixel); letter-spacing: .2em; }
.dpad { --k: clamp(26px, 2.6vw, 36px); position: relative; justify-self: center; width: calc(var(--k) * 3); height: calc(var(--k) * 3); }
.dpad::after { content: ""; position: absolute; left: var(--k); top: var(--k); width: var(--k); height: var(--k); background: var(--shell); }
.dpad button { position: absolute; width: var(--k); height: var(--k); border: 0; background: var(--shell); color: var(--gold); cursor: pointer; display: grid; place-items: center; font-size: 10px; }
.dpad button::after { content: ""; position: absolute; inset: -8px; }
.dpad button:hover { background: #3b3b3b; }
.dpad button:active { background: var(--black); }
.dpad .up { left: var(--k); top: 0; border-radius: 6px 6px 0 0; }
.dpad .down { left: var(--k); bottom: 0; border-radius: 0 0 6px 6px; }
.dpad .left { left: 0; top: var(--k); border-radius: 6px 0 0 6px; }
.dpad .right { right: 0; top: var(--k); border-radius: 0 6px 6px 0; }
/* A and B share one size token so they always scale together */
.ab { --ab: clamp(44px, 3.4vw, 50px); justify-self: center; display: flex; align-items: center; gap: calc(var(--ab) * .34); padding: calc(var(--ab) * .3) 0; transform: rotate(-22deg); }
.ab button { flex: none; width: var(--ab); height: var(--ab); padding: 0; border-radius: 50%; border: 3px solid var(--black); background: radial-gradient(circle at 34% 28%, rgba(255, 255, 255, .2), rgba(255, 255, 255, 0) 46%), var(--shell); color: var(--gold); font: calc(var(--ab) * .22)/1 var(--f-pixel); cursor: pointer; box-shadow: 0 4px 0 var(--black); transition: transform .08s steps(1), box-shadow .08s steps(1); -webkit-tap-highlight-color: transparent; }
.ab button:hover { color: var(--room-text); }
.ab button:active { transform: translateY(4px); box-shadow: 0 0 0 var(--black); }
.ab .a { transform: translateY(calc(var(--ab) * -.42)); }
.ab .a:active { transform: translateY(calc(var(--ab) * -.42 + 4px)); }

/* Select World: three prints, photographs only */
.wall { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gutter); align-items: start; }
.print { display: block; transition: opacity .6s var(--ease); }
.print img { width: 100%; }
.wall:hover .print:not(:hover) { opacity: .45; }
.print--a { grid-column: 1 / span 8; grid-row: 1; }
.print--b { grid-column: 10 / span 3; grid-row: 1; align-self: end; }
.print--c { grid-column: 4 / span 6; grid-row: 2; margin-top: var(--s6); }

/* VIDEO feature: one cinematic band */
.room { background: var(--room); color: var(--room-text); }
.feature { padding-block: var(--s7); }
.feature__in { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gutter); align-items: end; }
.feature__media { grid-column: 1 / span 9; display: block; background: #111; }
.feature__media video { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
.feature__side { grid-column: 10 / span 3; display: grid; gap: var(--s2); justify-items: start; padding-left: var(--s2); }
.feature .t-section { color: var(--gold); }

/* SHOP preview: a short price list beside the album */
.store { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gutter); align-items: center; }
.store__side { grid-column: 1 / span 5; display: grid; gap: var(--s4); }
.store__list { border-top: 1px solid var(--rule); }
.store__list a { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--rule); color: var(--ink); text-decoration: none; }
.store__name { font: 500 var(--fs-title)/1.2 var(--f-sans); letter-spacing: -.01em; transition: transform var(--t-base) var(--ease); }
.store__list a:hover .store__name { transform: translateX(6px); }
.store__media { grid-column: 7 / -1; display: block; background: #fff; aspect-ratio: 1; }
.store__media img { width: 100%; height: 100%; object-fit: contain; }

/* ==========================================================================
   FOTO — an independent photo book: spreads, then a contact strip per series
   ========================================================================== */
.series { padding-bottom: var(--s7); }
.series__item { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gutter); align-items: end; color: inherit; text-decoration: none; }
.series__item ~ .series__item { margin-top: var(--s7); }
.series__img { grid-column: 1 / span 8; display: block; overflow: hidden; }
.series__img img { width: 100%; transition: transform 1.2s var(--ease); }
.series__item:hover .series__img img { transform: scale(1.015); }
.series__txt { grid-column: 10 / span 3; display: grid; gap: var(--s2); justify-items: start; padding-bottom: 6px; }
.series__txt .t-section { font-size: clamp(28px, 3vw, 44px); }
.series__meta { margin-top: var(--s1); }
.series__item:nth-of-type(2) .series__img { grid-column: 5 / span 8; order: 2; }
.series__item:nth-of-type(2) .series__txt { grid-column: 1 / span 3; order: 1; }
.series__item:nth-of-type(3) .series__img { grid-column: 2 / span 7; }
/* contact strip: film base with sprocket holes; frames sit inside, never covered */
.sheet { margin-top: var(--s4); padding: 20px 16px 12px; background: #111 radial-gradient(circle, rgba(251, 248, 238, .7) 0 2px, transparent 2.5px) 0 4px / 16px 9px repeat-x; }
.sheet__frames { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(124px, 1fr); gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: thin; scrollbar-color: #444 transparent; padding-bottom: 4px; }
.sheet__frames li { display: grid; gap: 8px; scroll-snap-align: start; }
.sheet__frame { display: block; padding: 0; border: 0; background: #000; aspect-ratio: 3 / 2; cursor: zoom-in; }
.sheet__frame img { width: 100%; height: 100%; object-fit: contain; transition: opacity var(--t-base); }
.sheet__frame:hover img { opacity: .8; }
.sheet__no { font: 400 10px/1 var(--f-mono); letter-spacing: .06em; color: var(--gold); opacity: .8; }

/* gallery pages: large viewer, transport, staggered prints, page turn */
.pager { display: flex; flex-wrap: wrap; gap: 2px; }
.pager a { display: grid; place-items: center; min-width: 40px; height: 40px; font: 400 13px/1 var(--f-mono); color: var(--mute); text-decoration: none; border-bottom: 2px solid transparent; transition: color var(--t-fast), border-color var(--t-fast); }
.pager a:hover { color: var(--ink); }
.pager a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--gold); }
.viewer__stage { position: relative; height: min(78vh, 820px); min-height: 300px; }
.viewer__stage button { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; background: none; cursor: zoom-in; opacity: 0; visibility: hidden; transition: opacity var(--t-slow) var(--ease), visibility var(--t-slow); }
.viewer__stage button.is-on { opacity: 1; visibility: visible; }
.viewer__stage img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; }
.viewer__bar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 16px clamp(20px, 4vw, 48px); margin-top: var(--s3); }
.deck__lcd { display: flex; align-items: baseline; gap: 16px; font: 400 13px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.viewer__count { color: var(--mute); white-space: nowrap; }
.viewer__count b { color: var(--ink); font-weight: 500; }
.deck__time { color: var(--mute); }
.deck.is-playing .deck__time { color: var(--gold-3); }
.viewer__dots { display: flex; gap: 4px; }
.viewer__dots button { flex: 1 1 0; max-width: 72px; height: 44px; padding: 0; border: 0; background: none; cursor: pointer; display: grid; align-items: center; }
.viewer__dots button::before { content: ""; height: 2px; background: var(--rule-strong); transition: background-color var(--t-fast), height var(--t-fast); }
.viewer__dots button:hover::before { background: var(--ink); }
.viewer__dots button[aria-current="true"]::before { height: 4px; background: var(--gold); }
.viewer__arrows { display: flex; gap: 8px; }
.plates { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s5) clamp(24px, 4vw, 64px); max-width: 1180px; margin-inline: auto; align-items: start; }
.plates--bw > :nth-child(3n + 2) { margin-top: clamp(40px, 7vw, 104px); }
.plates--bw > :nth-child(3n) { margin-top: clamp(16px, 2.6vw, 40px); }
.plates--color { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 860px; column-gap: clamp(32px, 7vw, 104px); }
.plates--color > :nth-child(even) { margin-top: clamp(64px, 11vw, 160px); }
.plates--film > :nth-child(3n + 2) { margin-top: clamp(32px, 6vw, 88px); }
.plates--wide { max-width: var(--max); }
.plates--wide > .span-2 { grid-column: span 2; }
.plates--wide > :nth-child(2), .plates--wide > :nth-child(5) { margin-top: clamp(48px, 9vw, 140px); }
.plate { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; text-align: left; justify-self: center; }
.plate__img { display: block; }
.plate img { width: 100%; transition: opacity var(--t-base); }
.plate:hover img { opacity: .86; }
.plate__no { display: flex; justify-content: space-between; margin-top: 10px; font: 400 11px/1 var(--f-mono); letter-spacing: .06em; color: var(--mute); }
.strips { display: grid; gap: var(--s4); }
.strip { display: block; padding: 0; border: 0; background: none; cursor: zoom-in; line-height: 0; }
.strip img { width: 100%; }
.pagenav { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gutter); margin-top: var(--s7); border-top: 1px solid var(--rule); }
.pagenav a { display: grid; gap: 6px; padding-block: 28px; text-decoration: none; color: inherit; }
.pagenav a:last-child { justify-items: end; text-align: right; }
.pagenav .t-title { font-size: clamp(24px, 2.6vw, 36px); font-weight: 600; letter-spacing: -.03em; transition: transform var(--t-base) var(--ease); }
.pagenav a:first-child:hover .t-title { transform: translateX(-8px); }
.pagenav a:last-child:hover .t-title { transform: translateX(8px); }

/* ==========================================================================
   VIDEO — a private cinema: one projector, an archive list
   ========================================================================== */
.view.is-room { background: var(--room); color: var(--room-text); }
.cinema { padding-block: var(--s6) var(--s5); }
.cinema__head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px 24px; margin-bottom: var(--s4); }
.cinema__head .t-page { color: var(--gold); }
.player { background: #0b0b0b; }
.player__screen { position: relative; aspect-ratio: 16 / 9; background: #000; }
.player__video { width: 100%; height: 100%; max-width: none; object-fit: contain; cursor: pointer; }
.player__big { position: absolute; left: 50%; top: 50%; display: grid; place-items: center; width: 68px; height: 68px; margin: -34px 0 0 -34px; border: 0; border-radius: 50%; background: rgba(225, 197, 100, .92); color: var(--black); cursor: pointer; transition: opacity var(--t-base); }
.player__big svg { width: 22px; height: 22px; margin-left: 3px; fill: currentColor; shape-rendering: crispEdges; }
.player.is-playing .player__big { opacity: 0; pointer-events: none; }
.player.is-switch .player__screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(transparent 0 42%, rgba(255, 255, 255, .14) 42% 44%, transparent 44%); animation: tracking .4s steps(4) both; }
@keyframes tracking { from { transform: translateY(-30%); opacity: 1; } to { transform: translateY(40%); opacity: 0; } }
.player__bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 14px 0; border-bottom: 1px solid rgba(255, 255, 255, .14); }
.player__keys { display: flex; gap: 6px; }
.player .key { border-color: rgba(255, 255, 255, .3); color: var(--room-text); }
.player .key:hover, .player .key[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--black); }
.player__now { display: grid; gap: 2px; min-width: 0; }
.player__title { font: 500 16px/1.3 var(--f-sans); color: var(--room-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player__seek { flex: 1 1 180px; height: 44px; margin: 0; background: none; accent-color: var(--gold); cursor: pointer; }
.player__time { font: 400 13px/1 var(--f-mono); font-variant-numeric: tabular-nums; color: var(--room-text); white-space: nowrap; }
.player__yt { display: inline-flex; align-items: center; min-height: 44px; font: 500 12px/1 var(--f-mono); letter-spacing: .06em; color: var(--gold); text-decoration: none; }
.player__yt::after { content: " ↗"; }
.player__yt:hover { text-decoration: underline; text-underline-offset: 4px; }
.player__yt[hidden] { display: none; }
.shelf-wrap { padding-bottom: var(--s7); }
.shelf { display: grid; grid-template-columns: 1fr 1fr; column-gap: var(--s5); }
.tape { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, .14); }
.tape__pick { display: grid; grid-template-columns: 28px clamp(112px, 12vw, 176px) minmax(0, 1fr) auto; align-items: center; gap: 18px; padding: 18px 0; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; }
.tape__cover { position: relative; display: block; aspect-ratio: 16 / 9; overflow: hidden; background: #111; }
.tape__cover img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-fit: cover; transition: opacity var(--t-base); }
.tape__name { display: grid; gap: 2px; font: 500 clamp(17px, 1.5vw, 21px)/1.2 var(--f-sans); letter-spacing: -.01em; color: var(--room-text); }
.tape__name .t-zh { font-size: 14px; }
.tape__no, .tape__tc { color: var(--room-mute); }
.tape__yt { padding-left: 16px; min-height: 44px; display: inline-flex; align-items: center; color: var(--room-mute); text-decoration: none; }
.tape__yt:hover { color: var(--gold); }
.tape__pick:hover .tape__name, .tape__pick[aria-pressed="true"] .tape__name, .tape__pick[aria-pressed="true"] .tape__no { color: var(--gold); }
.tape__pick:hover .tape__cover img { opacity: .85; }
.tape__pick[aria-pressed="true"] .tape__cover { box-shadow: 0 0 0 2px var(--gold); }

/* ==========================================================================
   SHOP — a curated catalog: three objects on white, one detail view
   ========================================================================== */
.shop-head { position: relative; overflow: hidden; }
.shop-head__pattern { position: absolute; inset: 0; background-size: 420px auto; background-position: center; opacity: .08; filter: grayscale(1); }
.shop-head .page-head { position: relative; padding-bottom: var(--s4); }
.catalog { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gutter); margin-top: var(--s3); }
.case { display: grid; color: var(--ink); text-decoration: none; }
.case__art { position: relative; display: block; aspect-ratio: 1; background: #fff; overflow: hidden; }
.case__art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transition: transform .8s var(--ease); }
.case:hover .case__art img { transform: scale(1.03); }
.case__info { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 4px 16px; padding: 14px 0 12px; border-bottom: 2px solid transparent; }
.case__no { grid-column: 1 / -1; }
.case__name { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font: 500 var(--fs-title)/1.2 var(--f-sans); letter-spacing: -.01em; }
.case__name .t-zh { font-size: 14px; }
.case__price { color: var(--ink); }
.case[aria-current="page"] .case__info { border-bottom-color: var(--gold); }
.case[aria-current="page"] .case__no::after { content: " · NOW"; color: var(--gold-3); }
.product { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gutter); align-items: start; padding-block: var(--s6) var(--s7); border-top: 1px solid var(--rule); }
.product__media { grid-column: 1 / span 7; display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: var(--s3); }
.product__thumbs { display: grid; gap: 12px; align-content: start; }
.product__thumbs button { padding: 0; border: 0; background: #fff; cursor: pointer; opacity: .5; transition: opacity var(--t-fast); }
.product__thumbs button:hover, .product__thumbs button[aria-current="true"] { opacity: 1; }
.product__main { position: relative; background: #fff; aspect-ratio: 1; }
.product__main img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity .6s var(--ease); }
.product__main img.is-on { opacity: 1; }
.product__info { grid-column: 9 / span 4; position: sticky; top: calc(var(--head) + 40px); display: grid; gap: var(--s3); }
.price { justify-self: start; font: 500 clamp(22px, 2vw, 28px)/1 var(--f-mono); letter-spacing: .02em; }
.qty { display: inline-flex; justify-self: start; align-items: stretch; border: 1px solid var(--rule-strong); }
.qty button { width: 44px; height: 44px; border: 0; background: none; font: 400 18px/1 var(--f-mono); cursor: pointer; }
.qty button:hover { background: var(--gold); color: var(--black); }
.qty input, .qty output { width: 52px; display: grid; place-items: center; border: 0; border-inline: 1px solid var(--rule); background: none; text-align: center; font: 500 15px/1 var(--f-mono); -moz-appearance: textfield; appearance: textfield; }
.qty input::-webkit-outer-spin-button, .qty input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.buy { display: grid; gap: 14px; margin-top: var(--s1); }
.buy .btn { width: calc(100% - 12px); }
.product__links { display: flex; flex-wrap: wrap; gap: var(--s3); padding-top: var(--s2); border-top: 1px solid var(--rule); }

/* cart drawer (GBA window) */
.scrim { position: fixed; inset: 0; z-index: 70; background: rgba(0, 0, 0, .35); opacity: 0; visibility: hidden; transition: opacity var(--t-base), visibility var(--t-base); }
.scrim.on { opacity: 1; visibility: visible; }
.drawer { position: fixed; z-index: 75; top: 16px; right: 16px; bottom: 16px; width: min(420px, calc(100% - 32px)); display: grid; grid-template-rows: auto 1fr auto; transform: translateX(calc(100% + 40px)); visibility: hidden; transition: transform .45s steps(6), visibility .45s; }
.drawer.on { transform: none; visibility: visible; }
.drawer__head { display: flex; align-items: center; justify-content: space-between; padding: 14px 12px 10px 24px; border-bottom: 1px solid var(--rule); }
.drawer__body { overflow: auto; padding: 0 24px; }
.drawer__foot { display: grid; gap: 18px; padding: 18px 24px 24px; }
.line { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding-block: 16px; border-bottom: 1px solid var(--rule); }
.line img { width: 64px; background: #fff; }
.line__name { display: block; font: 500 15px/1.3 var(--f-sans); }
.line .qty button { width: 34px; height: 34px; font-size: 14px; }
.line .qty output { width: 34px; font-size: 13px; }
.total { display: flex; justify-content: space-between; font: 500 15px/1 var(--f-mono); }
.empty { display: grid; gap: 18px; justify-items: start; padding-block: 24px; color: var(--mute); }
.empty img { width: 56px; }

/* ==========================================================================
   CONTACT — a single message window (the original form, nothing added)
   ========================================================================== */
.mail { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gutter); align-items: start; padding-block: var(--s6) var(--s7); }
.mail__side { grid-column: 1 / span 4; display: grid; gap: var(--s5); align-content: start; position: sticky; top: calc(var(--head) + 40px); }
.mail__art { position: relative; width: min(200px, 60%); aspect-ratio: 1; display: grid; place-items: center; background: var(--gold); border-radius: 12px 12px 36px 12px; }
.mail__env { width: 100%; }
.mail__env svg { display: block; width: 44%; height: auto; margin-inline: auto; fill: var(--black); shape-rendering: crispEdges; }
.mail__art img { position: absolute; right: -16px; bottom: -16px; width: 64px; }
.mail__art.is-sent .mail__env { animation: fly 1.1s steps(9) both; }
@keyframes fly { 40% { transform: translate(10%, -10%) rotate(-8deg); } 99% { transform: translate(160%, -140%) rotate(-20deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
.mail__win { grid-column: 6 / span 7; display: grid; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.mail__bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: var(--shell); color: var(--gold); font: 500 12px/1 var(--f-mono); letter-spacing: .08em; }
.winbtns { display: flex; gap: 5px; }
.winbtns i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid rgba(225, 197, 100, .55); }
.mail__row { display: grid; grid-template-columns: 132px minmax(0, 1fr); align-items: center; gap: 16px; min-height: 58px; padding: 0 clamp(18px, 3vw, 28px); border-bottom: 1px solid var(--rule); }
.mail__key { font: 400 var(--fs-label)/1.4 var(--f-mono); letter-spacing: .04em; color: var(--mute); }
.mail__row:focus-within { background: rgba(225, 197, 100, .12); }
.mail__row:focus-within .mail__key { color: var(--ink); }
.mail__to { justify-self: start; padding: 5px 12px; border-radius: 14px; background: var(--gold); color: var(--black); font: 500 13px/1 var(--f-mono); }
.mail__body { display: grid; gap: 10px; padding: 20px clamp(18px, 3vw, 28px) 0; }
.mail__foot { display: flex; justify-content: flex-end; padding: 16px clamp(18px, 3vw, 28px) 24px; }
.mail .input, .mail__row .input { border-bottom: 0; padding: 14px 0; }
.mail .input:focus { background: none; }
.mail__body textarea { min-height: 220px; resize: vertical; line-height: 1.7; }

/* login (under SHOP) */
.form-page { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gutter); padding-block: var(--s6) var(--s7); align-items: start; }
.form-page__head { grid-column: 1 / span 4; display: grid; gap: var(--s4); align-content: start; }
.form-page__head img { width: 72px; }
.form-page__body { grid-column: 6 / span 7; padding: clamp(28px, 4vw, 48px); background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; }
.field { display: grid; gap: 6px; }
.field > span { font: 400 var(--fs-label)/1.4 var(--f-mono); letter-spacing: .04em; color: var(--mute); }
.input { width: 100%; padding: 12px 0; border: 0; border-bottom: 1px solid var(--rule-strong); border-radius: 0; background: transparent; font: 400 17px/1.5 var(--f-sans); color: var(--ink); transition: border-color var(--t-fast), background-color var(--t-fast); }
.input:hover { border-bottom-color: var(--ink); }
.input:focus { outline: none; border-bottom-color: var(--gold-3); }
.input.is-invalid { border-bottom-color: #a4342a; background: rgba(164, 52, 42, .06); }
textarea.input { min-height: 140px; resize: vertical; }
.stack { display: grid; gap: var(--s3); }
.check { display: flex; align-items: center; gap: 12px; font-size: var(--fs-small); color: var(--ink-soft); cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--gold-3); }
.auth__tabs { display: flex; gap: var(--s4); margin-bottom: var(--s4); border-bottom: 1px solid var(--rule); }
.auth__tabs button { min-height: 48px; padding: 0; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; font: 500 15px/1 var(--f-sans); color: var(--mute); cursor: pointer; }
.auth__tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
.auth__panes { display: grid; }
.auth__panes form { grid-area: 1 / 1; transition: opacity var(--t-base) steps(3), visibility var(--t-base); }
.auth__panes form[aria-hidden="true"] { opacity: 0; visibility: hidden; }
.socials { display: flex; align-items: center; gap: 14px; margin-top: var(--s4); padding-top: var(--s3); border-top: 1px solid var(--rule); }
.socials button { width: 44px; height: 44px; padding: 10px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px var(--rule-strong); cursor: pointer; }
.socials button:hover { box-shadow: 0 0 0 2px var(--gold); }

/* ---------- Lightbox: the photograph, as large as the screen allows ---------- */
/* gutters: room for the close bar above and the arrows beside — never on top of the picture */
.lb { --gx: clamp(76px, 7vw, 120px); --gt: 64px; --gb: 40px; position: fixed; inset: 0; z-index: 90; color: var(--ink); background: rgba(251, 248, 238, .96); -webkit-backdrop-filter: blur(18px) saturate(.9); backdrop-filter: blur(18px) saturate(.9); opacity: 0; visibility: hidden; transition: opacity .35s var(--ease), visibility 0s .35s; }
[data-theme="dark"] .lb { background: rgba(12, 11, 8, .95); }
.lb.on { opacity: 1; visibility: visible; transition: opacity .35s var(--ease), visibility 0s; }
.lb__stage { position: absolute; top: calc(var(--gt) + env(safe-area-inset-top)); bottom: calc(var(--gb) + env(safe-area-inset-bottom)); left: max(var(--gx), env(safe-area-inset-left)); right: max(var(--gx), env(safe-area-inset-right)); }
.lb__img { position: absolute; left: 50%; top: 50%; max-width: none; object-fit: contain; background: rgba(0, 0, 0, .04); transform: translate(-50%, -50%) scale(.97); opacity: 0; transition: opacity .45s var(--ease), transform .55s var(--ease); user-select: none; -webkit-user-drag: none; }
.lb__img.is-in { opacity: 1; transform: translate(-50%, -50%); }
.lb__img.is-out-l { opacity: 0; transform: translate(calc(-50% - 32px), -50%); }
.lb__img.is-out-r { opacity: 0; transform: translate(calc(-50% + 32px), -50%); }
.lb__bar { position: absolute; left: 0; right: 0; top: env(safe-area-inset-top); height: var(--gt); display: flex; justify-content: space-between; align-items: center; padding: 0 max(var(--pad), env(safe-area-inset-right)) 0 max(var(--pad), env(safe-area-inset-left)); }
.lb__count { font: 400 13px/1 var(--f-mono); letter-spacing: .06em; color: var(--mute); font-variant-numeric: tabular-nums; }
.lb__count b { color: var(--ink); font-weight: 500; }
.lb__tools { display: flex; gap: 6px; }
.lb__tool { display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--ink); cursor: pointer; font: 400 20px/1 var(--f-sans); transition: background-color var(--t-fast); }
.lb__tool svg { width: 16px; height: 16px; fill: currentColor; shape-rendering: crispEdges; }
.lb__tool:hover { background: var(--rule); }
.lb__nav { position: absolute; top: 50%; display: grid; place-items: center; width: 52px; height: 52px; margin-top: -26px; padding: 0; border: 1px solid var(--rule-strong); border-radius: 50%; background: none; color: var(--ink); cursor: pointer; transition: background-color var(--t-fast), border-color var(--t-fast), color var(--t-fast); }
.lb__nav svg { width: 14px; height: 14px; fill: currentColor; shape-rendering: crispEdges; }
.lb__nav:hover { background: var(--gold); border-color: var(--gold); color: var(--black); }
.lb__nav--prev { left: calc((var(--gx) - 52px) / 2); }
.lb__nav--next { right: calc((var(--gx) - 52px) / 2); }
.lb__nav[hidden] { display: none; }
.lb__load { position: absolute; left: 50%; top: 50%; display: flex; gap: 6px; transform: translate(-50%, -50%); opacity: 0; transition: opacity .2s; pointer-events: none; }
.lb__load i { width: 6px; height: 6px; background: var(--gold-3); animation: blink 1s steps(1) infinite; }
.lb__load i:nth-child(2) { animation-delay: .2s; } .lb__load i:nth-child(3) { animation-delay: .4s; }
.lb.is-loading .lb__load { opacity: 1; transition-delay: .2s; }
@media (max-width: 700px) {
    /* phones: the photo takes the full width, controls move to a bar underneath */
    .lb { --gx: 10px; --gt: 56px; --gb: 84px; }
    .lb__nav { top: auto; bottom: calc(16px + env(safe-area-inset-bottom)); margin-top: 0; width: 52px; height: 52px; }
    .lb__nav--prev { left: calc(50% - 64px); }
    .lb__nav--next { right: calc(50% - 64px); }
}
@media (max-width: 700px) and (orientation: landscape) {
    .lb { --gx: 72px; --gt: 48px; --gb: 12px; }
    .lb__nav { top: 50%; bottom: auto; margin-top: -26px; }
    .lb__nav--prev { left: 10px; }
    .lb__nav--next { right: 10px; }
}

/* ---------- Title screen (original film + original GIF) ---------- */
.intro { position: fixed; inset: 0; z-index: 100; overflow: hidden; background: #000; color: var(--wall); }
.intro[hidden] { display: none; }
.intro__video { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-fit: cover; object-position: 50% 55%; background: #111 url('assets/img/video/ho-1280.webp') center / cover; opacity: 0; transition: opacity .8s var(--ease); }
.intro__video.is-playing, .intro__video.is-poster { opacity: 1; }
.intro__veil { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 60% 48% at 50% 46%, rgba(251, 248, 238, .34), rgba(251, 248, 238, 0) 72%), rgba(251, 248, 238, .5); }
.intro__corners { position: absolute; inset: clamp(14px, 2vw, 26px); pointer-events: none; background:
    linear-gradient(var(--gold-2), var(--gold-2)) top left / 22px 3px, linear-gradient(var(--gold-2), var(--gold-2)) top left / 3px 22px,
    linear-gradient(var(--gold-2), var(--gold-2)) top right / 22px 3px, linear-gradient(var(--gold-2), var(--gold-2)) top right / 3px 22px,
    linear-gradient(var(--gold-2), var(--gold-2)) bottom left / 22px 3px, linear-gradient(var(--gold-2), var(--gold-2)) bottom left / 3px 22px,
    linear-gradient(var(--gold-2), var(--gold-2)) bottom right / 22px 3px, linear-gradient(var(--gold-2), var(--gold-2)) bottom right / 3px 22px;
    background-repeat: no-repeat; }
.intro__osd { position: absolute; top: calc(clamp(14px, 2vw, 26px) + 24px); left: calc(clamp(14px, 2vw, 26px) + 24px); right: calc(clamp(14px, 2vw, 26px) + 24px); display: flex; justify-content: space-between; font: 500 12px/1 var(--f-mono); letter-spacing: .1em; color: rgba(0, 0, 0, .7); font-variant-numeric: tabular-nums; pointer-events: none; }
.intro__center { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-58%); display: grid; justify-items: center; gap: clamp(24px, 4.5vh, 44px); }
.intro__logo { width: clamp(150px, 16vw, 200px); height: auto; }
.intro__start { position: relative; display: inline-flex; align-items: center; gap: 14px; padding: 14px 18px; border: 0; background: none; color: var(--black); font: clamp(12px, 1.3vw, 15px)/1 var(--f-pixel); letter-spacing: .14em; text-shadow: 2px 2px 0 var(--gold); cursor: pointer; animation: startBreathe 1.6s steps(2) infinite; -webkit-tap-highlight-color: transparent; }
.intro__start::after { content: ""; position: absolute; inset: 0; box-shadow: 0 -2px 0 0 currentColor, 0 2px 0 0 currentColor, -2px 0 0 0 currentColor, 2px 0 0 0 currentColor; opacity: 0; transition: opacity var(--t-fast) steps(2); }
.intro__start:hover::after, .intro__start:focus-visible::after { opacity: .7; }
.intro__start:focus-visible { outline: none; }
.intro__arrow { color: var(--gold-2); animation: blink 1s steps(1) infinite; }
@keyframes startBreathe { 50% { opacity: .55; } }
.intro__foot { position: absolute; left: clamp(32px, 4vw, 56px); right: clamp(32px, 4vw, 56px); bottom: max(clamp(28px, 4vw, 48px), env(safe-area-inset-bottom)); display: flex; justify-content: space-between; gap: 16px; font: 500 12px/1.4 var(--f-mono); letter-spacing: .12em; color: rgba(0, 0, 0, .72); }
.intro__type::after { content: "▌"; color: var(--gold-2); animation: blink 1s steps(1) infinite; }
.intro.is-booting .intro__video { animation: crtOn .8s cubic-bezier(.2, .8, .2, 1) .05s both; }
.intro.is-booting .intro__logo { animation: bootLogo .7s steps(7) .15s both; }
.intro.is-booting .intro__start, .intro.is-booting .intro__foot, .intro.is-booting .intro__corners, .intro.is-booting .intro__osd { animation: bootUi .3s steps(3) 1s both; }
@keyframes crtOn { 0% { transform: scale(0, .004); } 45% { transform: scale(1, .004); } 100% { transform: none; } }
@keyframes bootLogo { from { opacity: 0; transform: translateY(-48px); } }
@keyframes bootUi { from { opacity: 0; } }
.intro.is-pressed .intro__start { animation: pressed .09s steps(1) 3; }
@keyframes pressed { 50% { opacity: 0; } }
.mosaic { position: fixed; inset: 0; z-index: 110; display: grid; pointer-events: none; }
.mosaic i { background: var(--black); transform: scale(0); }
.mosaic i:nth-child(3n) { background: var(--gold); }
.mosaic.fill i { animation: cellIn .16s steps(2) var(--d) both; }
.mosaic.clear i { transform: scale(1); animation: cellOut .16s steps(2) var(--d) both; }
@keyframes cellIn { to { transform: scale(1); } }
@keyframes cellOut { to { transform: scale(0); } }

/* ---------- Footer: the original yellow band ---------- */
.foot { background: var(--gold); color: var(--black); }
.foot__in { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gutter); padding-block: var(--s6) 32px; }
.foot__brand { grid-column: 1 / span 4; display: grid; gap: var(--s2); align-content: start; justify-items: start; }
.foot__brand a { line-height: 0; }
.foot__brand img { width: 120px; height: auto; }
.foot__tag { font: 500 var(--fs-small)/1.5 var(--f-sans); }
.foot__nav { grid-column: 6 / -1; justify-self: end; align-self: end; }
.foot__nav ul { display: flex; gap: clamp(4px, 1.6vw, 24px); }
.foot__nav a { display: grid; justify-items: center; gap: 10px; min-width: 64px; padding: 10px 6px; color: var(--black); text-decoration: none; font: 500 12px/1 var(--f-mono); letter-spacing: .06em; }
.foot__nav svg { width: 22px; height: 22px; fill: currentColor; shape-rendering: crispEdges; transition: transform .2s steps(2); }
.foot__nav a:hover svg, .foot__nav a:focus-visible svg { transform: translateY(-3px); }
.foot__nav a:hover span, .foot__nav a:focus-visible span { box-shadow: 0 2px 0 var(--black); }
.foot__legal { grid-column: 1 / -1; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 40px; margin-top: var(--s5); padding-top: 20px; border-top: 1px solid rgba(0, 0, 0, .2); font-size: 13px; line-height: 1.7; color: #4a4022; overflow-wrap: anywhere; }

/* GBA message window */
.toast { position: fixed; z-index: 95; left: 50%; bottom: 28px; max-width: min(460px, calc(100% - 40px)); padding: 16px 22px; font-size: var(--fs-small); line-height: 1.55; transform: translate(-50%, 12px); opacity: 0; visibility: hidden; transition: transform var(--t-base) steps(3), opacity var(--t-base) steps(3), visibility var(--t-base); }
.toast.on { transform: translate(-50%, 0); opacity: 1; visibility: visible; }
.toast .cur { display: none; }

.notfound { display: grid; gap: var(--s3); justify-items: start; padding-block: var(--s7); }
.notfound img { width: 80px; }

/* ---------- Responsive ---------- */
@media (max-width: 1100px) {
    .hero { min-height: 0; row-gap: var(--s5); }
    .hero__copy { grid-column: 1 / -1; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: end; column-gap: var(--s5); }
    .hero__kicker, .hero__hello { grid-column: 1; }
    .index { grid-column: 2; grid-row: 1 / span 2; }

}

    .product__media, .product__info { grid-column: 1 / -1; }

}
@media (max-width: 700px) {

/* every photograph: true width/height (no crop, no layout shift), lazy, fades in once decoded.

function img(p, { alt = '', sizes = '100vw', eager = false, max = 1280, cap = true, attrs = '', cls = '' } = {}) {

/* ==========================================================================
   6. Router (hash based: GitHub Pages, any static host, or opened from disk)
   ========================================================================== */
const app = $('#app');
const foot = $('[data-foot]');
const wipe = $('.wipe');
let firstRender = true;

function resolve(route) {
    const m = route.match(/^(bw|color|film)(?:-(\d+))?$/);
    if (m) return { html: galleryView(m[1], m[2] ? +m[2] : 1), base: m[1] };
    if (route === 'start') return { html: views.home(), base: 'home' };
    if (views[route] && route !== 'notfound') return { html: views[route](), base: route.split('-')[0] };
    return { html: null, base: '' };
}
function render() {
    const route = (location.hash.slice(1) || 'home').toLowerCase();
    let { html, base } = resolve(route);
    if (!html) html = views.notfound();
    const swap = () => {
        stopVideos();
        const room = base === 'video';
        app.innerHTML = `<div class="view${room ? ' is-room' : ''}">${html}</div>`;
        
        const nav = NAV.find((n) => n.match.includes(base));
        document.title = base === 'home' ? 'FOTO!｜CIAO-LI Photography' : `${nav ? nav.label : 'FOTO!'}${WORLDS[base] ? ' · ' + WORLDS[base].name : ''}｜FOTO!`;
        markNav(base);
        bind();
        if (!firstRender) { window.scrollTo(0, 0); app.focus({ preventScroll: true }); }
        firstRender = false;
    };
    if (firstRender || reduceMotion) { swap(); return; }
    wipe.classList.remove('run'); void wipe.offsetWidth; wipe.classList.add('run');
    setTimeout(swap, 240);
}
window.addEventListener('hashchange', render);
function markNav(base) {
    $$('[data-nav] a, [data-menu] a').forEach((a) => {
        const item = NAV.find((n) => n.route === a.dataset.route);
        if (item && item.match.includes(base)) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
}

/* ==========================================================================
   7. Behaviour bound after each render
   ========================================================================== */
let videoIO, revealIO;
function stopVideos() { if (videoIO) videoIO.disconnect(); $$('video', app).forEach((v) => v.pause()); }
function playVideo(v) { if (!v.getAttribute('src')) v.src = v.dataset.src; if (!reduceMotion) v.play().catch(() => {}); }

function bindMedia() {
    $$('img.ph', app).forEach((im) => {
        if (im.complete && im.naturalWidth) im.classList.add('is-loaded');
        else im.addEventListener('load', () => im.classList.add('is-loaded'), { once: true });
    });
    // videos download only near the viewport, and pause when they leave it
    const vids = $$('video[data-src]', app);
    if (vids.length) {
        videoIO = new IntersectionObserver((entries) => entries.forEach((en) => {
            const v = en.target;
            if (en.isIntersecting && !v.classList.contains('off')) playVideo(v);
            else if (!v.paused) v.pause();
        }), { rootMargin: '200px 0px', threshold: .01 });
        vids.forEach((v) => videoIO.observe(v));
        // tape labels show each clip's real running time once its metadata arrives
    }
    const rev = $$('.reveal', app);
    if (revealIO) revealIO.disconnect();
    if ('IntersectionObserver' in window && !reduceMotion) {
        revealIO = new IntersectionObserver((entries) => entries.forEach((en) => {
            if (en.isIntersecting) { en.target.classList.add('is-in'); revealIO.unobserve(en.target); }
        }), { rootMargin: '0px 0px -8% 0px', threshold: .06 });
        rev.forEach((el) => revealIO.observe(el));
    } else rev.forEach((el) => el.classList.add('is-in'));
}

function bindGba() {
    const g = $('[data-gba]', app);
    if (!g) return;
    let ch = 0;
    const layers = $$('[data-ch]', g);
    const set = (i) => {
        ch = (i + CHANNELS.length) % CHANNELS.length;
        layers.forEach((el) => el.classList.toggle('off', +el.dataset.ch !== ch));
        $('[data-ch-label]', g).textContent = CHANNELS[ch].label;
        $('[data-ch-num]', g).textContent = `CH ${pad2(ch + 1)}`;
        const s = $('[data-screen]', g);
        s.setAttribute('href', `#${CHANNELS[ch].route}`);
        s.setAttribute('aria-label', `前往 ${CHANNELS[ch].label}`);
        const v = $('video', g);
        if (ch === 0) playVideo(v); else v.pause();
    };
    $$('[data-ch-step]', g).forEach((b) => b.addEventListener('click', () => set(ch + +b.dataset.chStep)));
    $('[data-ch-enter]', g).addEventListener('click', () => { location.hash = CHANNELS[ch].route; });
}

let deckTimer = 0, deckClock = 0;
function bindViewer() {
    clearInterval(deckTimer); clearInterval(deckClock);
    const v = $('[data-viewer]', app);
    if (!v) return;
    const slides = $$('[data-feat]', v);
    const dots = $$('[data-dots] button', v);
    let cur = 0;
    const go = (i) => {
        cur = (i + slides.length) % slides.length;
        slides.forEach((s, k) => { s.classList.toggle('is-on', k === cur); s.tabIndex = k === cur ? 0 : -1; });
        dots.forEach((d, k) => d.setAttribute('aria-current', String(k === cur)));
        $('[data-count]', v).innerHTML = `<b>${pad2(cur + 1)}</b> / ${pad2(slides.length)}`;
    };
    dots.forEach((d, i) => d.addEventListener('click', () => go(i)));
    $$('[data-step]', v).forEach((b) => b.addEventListener('click', () => go(cur + +b.dataset.step)));
    v.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') go(cur + 1); if (e.key === 'ArrowLeft') go(cur - 1); });
    // play / pause: a slideshow driven like a disc player — never starts on its own
    const deck = $('.deck', v), playBtn = $('[data-play]', v), timeEl = $('[data-time]', v);
    let secs = 0;
    const stop = () => {
        clearInterval(deckTimer); clearInterval(deckClock);
        deck.classList.remove('is-playing');
        playBtn.setAttribute('aria-pressed', 'false'); playBtn.setAttribute('aria-label', '播放幻燈片'); playBtn.innerHTML = px('play');
    };
    const start = () => {
        deck.classList.add('is-playing');
        playBtn.setAttribute('aria-pressed', 'true'); playBtn.setAttribute('aria-label', '暫停幻燈片'); playBtn.innerHTML = px('pause');
        deckTimer = setInterval(() => go(cur + 1), 4000);
        deckClock = setInterval(() => { secs += 1; timeEl.textContent = `${pad2(Math.floor(secs / 60))}:${pad2(secs % 60)}`; }, 1000);
    };
    playBtn.addEventListener('click', () => (deck.classList.contains('is-playing') ? stop() : start()));
    $$('[data-feat]', v).forEach((b) => b.addEventListener('click', stop));   // opening the lightbox pauses the deck
    document.addEventListener('visibilitychange', () => { if (document.hidden && deck.isConnected) stop(); });
    let x0 = null;
    v.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, { passive: true });
    v.addEventListener('touchend', (e) => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) go(cur + (dx < 0 ? 1 : -1)); x0 = null; });
    (window.requestIdleCallback || ((f) => setTimeout(f, 1200)))(() => $$('img[loading="lazy"]', v).forEach((im) => { im.loading = 'eager'; }));
}

function bindGallery() {
    const g = $('.plates[data-world]', app);

}

let returnTo = null;
function bindShop() {
    const media = $('[data-product-media]', app);
    if (media) {
        $$('[data-pmain][data-on]', media).forEach((im) => im.classList.add('is-on'));
        $$('[data-pimg]', media).forEach((b) => b.addEventListener('click', () => {
            const i = +b.dataset.pimg;
            $$('[data-pimg]', media).forEach((x) => x.setAttribute('aria-current', String(x === b)));
            $$('[data-pmain]', media).forEach((im) => im.classList.toggle('is-on', +im.dataset.pmain === i));
        }));
    }
    const qty = $('[data-qty]', app);
    if (!qty) return;
    const input = $('input', qty);
    const clamp = (v) => Math.max(1, Math.min(99, isNaN(v) ? 1 : v));
    $$('[data-q]', qty).forEach((b) => b.addEventListener('click', () => { input.value = clamp(+input.value + +b.dataset.q); }));
    input.addEventListener('change', () => { input.value = clamp(parseInt(input.value, 10)); });
    $('[data-add]', app).addEventListener('click', (e) => {
        const k = e.currentTarget.dataset.add, q = clamp(+input.value);
        S.cart[k] = Math.min(99, S.cart[k] + q);
        save(); renderHeader();
        $$('.head [data-open-cart]').forEach((b) => { b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); });
        toast(`${PRODUCTS[k].name} × ${q} 已加入購物車。`);
    });
    $('[data-buy]', app).addEventListener('click', (e) => {
        const k = e.currentTarget.dataset.buy, q = clamp(+input.value);
        if (!S.user) { returnTo = location.hash; toast('請先登入，登入後會回到這個商品。'); location.hash = 'login'; return; }
        toast(`${PRODUCTS[k].name} × ${q}，NT.${PRODUCTS[k].price * q}（作品展示，不會實際付款）`);
    });
}

function validate(form) {
    let first = null;
    $$('input, textarea', form).forEach((el) => {
        const ok = el.checkValidity();
        el.classList.toggle('is-invalid', !ok);
        el.setAttribute('aria-invalid', String(!ok));
        if (!ok && !first) first = el;
    });
    if (first) { first.focus(); toast(first.validationMessage || '請確認欄位內容。'); }

introVideo.addEventListener('playing', () => introVideo.classList.add('is-playing'));
// show the poster frame straight away if the film needs a moment (no black flash)
setTimeout(() => introVideo.classList.add('is-poster'), 600);
function playIntroVideo() {
    if (reduceMotion) { introVideo.pause(); introVideo.classList.add('is-poster'); return; }
    const p = introVideo.play();
    if (p && p.catch) p.catch(() => {
        introVideo.classList.add('is-poster');       // autoplay blocked (e.g. iOS Low Power Mode): poster stays, first touch starts it
        const kick = () => { introVideo.play().catch(() => {}); };
        intro.addEventListener('touchstart', kick, { once: true, passive: true });
    });
}
// VCR timecode (hh:mm:ss:ff at 30 fps) follows the film while the title screen is up
let tcRaf = 0;
function tickTc() {
    const t = introVideo.currentTime || 0, f = Math.floor((t % 1) * 30);
    $('[data-intro-tc]', intro).textContent = `00:${pad2(Math.floor(t / 60))}:${pad2(Math.floor(t % 60))}:${pad2(f)}`;
    if (!intro.hidden) tcRaf = requestAnimationFrame(tickTc);
}
function showIntro(boot) {
    entering = false;
    closeMenu(); closeCart();
    intro.hidden = false;
    intro.classList.remove('is-pressed');
    intro.classList.toggle('is-booting', !!boot && !reduceMotion);
    setSiteInert(true);
    typewriter();
    playIntroVideo();
    cancelAnimationFrame(tcRaf); tickTc();
    $('[data-start]', intro).focus({ preventScroll: true });
}
function buildMosaic() {
    const small = innerWidth < 600;
    const cols = small ? 6 : 12, rows = small ? 10 : 8;
    mosaic.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    mosaic.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
    mosaic.innerHTML = Array.from({ length: cols * rows }, () => `<i style="--d:${Math.round(Math.random() * 220)}ms"></i>`).join('');
}
function enterSite() {
    if (entering || intro.hidden) return;      // ignore double clicks / repeated keys
    entering = true;
    const finish = () => {
        intro.hidden = true;
        introVideo.pause();
        intro.classList.remove('is-booting', 'is-pressed');
        clearTimeout(typeTimer);
        setSiteInert(false);
        if (location.hash === '#start' || !location.hash) history.replaceState(null, '', '#home');
        if (location.hash !== '#home' || !$('.view', app)) render();
        app.focus({ preventScroll: true });
        window.scrollTo(0, 0);
    };
    if (reduceMotion) { finish(); return; }
    intro.classList.add('is-pressed');
    setTimeout(() => {
        buildMosaic();
        mosaic.classList.add('fill');
        setTimeout(() => {
            finish();
            mosaic.classList.remove('fill');
            mosaic.classList.add('clear');
            setTimeout(() => { mosaic.classList.remove('clear'); mosaic.innerHTML = ''; }, 420);
        }, 400);
    }, 270);
}
$('[data-start]', intro).addEventListener('click', enterSite);
document.addEventListener('keydown', (e) => {
    if (intro.hidden) return;
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); enterSite(); }
});
window.addEventListener('hashchange', () => { if (location.hash === '#start') showIntro(false); });

/* ==========================================================================
   11. Boot
   ========================================================================== */
$('[data-nav]').innerHTML = NAV.map((n) => `<li><a class="ico" href="#${n.route}" data-route="${n.route}" data-tip="${n.label}" aria-label="${n.label}"><svg data-px="${n.route}"></svg></a></li>`).join('');
$('[data-menu]').innerHTML = NAV.map((n) => `<li><a class="menu__item" href="#${n.route}" data-route="${n.route}"><svg data-px="${n.route}"></svg><span>${n.label}</span></a></li>`).join('');
$('[data-footnav]').innerHTML = NAV.map((n) => `<li><a href="#${n.route}"><svg data-px="${n.route}"></svg><span>${n.label}</span></a></li>`).join('');
$$('svg[data-px]').forEach((s) => { s.outerHTML = px(s.dataset.px); });

renderHeader();
// The intro opens every fresh visit to the site root (or #start); deep links go straight to their page.
const firstHash = location.hash;
render();
if (!firstHash || firstHash === '#start' || firstHash === '#home') showIntro(true);
}
</script>
